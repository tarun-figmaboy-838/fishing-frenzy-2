<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&amp;family=Nunito:wght@600;700;800;900&amp;display=swap">
<style>
body{margin:0}
a{color:#123b63}a:hover{color:#0b2742}
.stage{position:relative;width:1280px;height:720px;overflow:hidden;font-family:'Nunito',system-ui,sans-serif;color:#123b63;user-select:none;-webkit-user-select:none;touch-action:none;background:#8fd0fb}
.stage button{font-family:inherit}
.w{opacity:0;transition:none}
.w.on{opacity:1;transition:opacity .18s ease,color .25s ease}
.w.cur{opacity:1;color:#c95a00;transition:opacity .18s ease,color .25s ease}
.bubA{animation:bubA .26s ease-out}
.bubB{animation:bubB .26s ease-out}
/* Narrator speech bubble: hugs its text and grows upward from a fixed anchor, so the tail always meets Swiftee */
.bubble{width:max-content;min-width:150px;max-width:380px;box-sizing:border-box;padding:14px 24px 15px;background:#fdf6e4;border:3px solid #2a9a8c;border-radius:20px;box-shadow:0 6px 16px rgba(18,59,99,.14);transform-origin:26px 100%}
.bubble-text{display:flex;flex-wrap:wrap;justify-content:center;column-gap:.28em;font-family:'Nunito',system-ui,sans-serif;font-weight:800;line-height:1.25;color:#123b63;text-align:center}
/* Tail sits on the inner edge of the bottom border: its fill opens the border, its edges run straight out of it,
   and anything above the border is clipped, so the outline reads as one continuous line */
.bubble-tail{position:absolute;left:26px;top:100%;display:block;overflow:hidden;filter:drop-shadow(0 4px 4px rgba(18,59,99,.10))}
@keyframes bubA{from{transform:scale(.97);opacity:.8}to{transform:scale(1);opacity:1}}
@keyframes bubB{from{transform:scale(.97);opacity:.8}to{transform:scale(1);opacity:1}}
/* Swiftee is intentionally static on every screen: fixed position, no idle, talk or reaction motion */
.bird{animation:none!important;transform:none!important;transition:none!important}
.hitp{animation:hitp 1.3s ease-in-out infinite}
@keyframes hitp{0%,100%{stroke:rgba(255,160,40,.06)}50%{stroke:rgba(255,160,40,.42)}}
.vp{animation:vp 1.3s ease-in-out infinite}
@keyframes vp{0%,100%{fill:rgba(142,68,214,.05)}50%{fill:rgba(142,68,214,.3)}}
.halo{animation:halo 1.2s ease-in-out infinite}
@keyframes halo{0%,100%{stroke-opacity:.25;stroke-width:4}50%{stroke-opacity:.7;stroke-width:10}}
.dashp{animation:dashp 1.6s ease-in-out infinite}
@keyframes dashp{0%,100%{opacity:.35}50%{opacity:1}}
.nudge{animation:nudge 1.1s ease-in-out infinite}
@keyframes nudge{0%,100%{transform:translateX(-4px)}50%{transform:translateX(4px)}}
.tag{position:absolute;transform:translate(-50%,-50%);font-weight:800;font-size:18px;padding:5px 14px;border-radius:10px;background:#fff;white-space:nowrap;box-shadow:0 2px 6px rgba(18,59,99,.12)}
.vlab{background:transparent;box-shadow:none;padding:0;font-size:21px;font-weight:900;color:#123b63}
.alab{background:rgba(255,255,255,.75);box-shadow:none;padding:1px 6px;font-size:17px;font-weight:900;color:#123b63}
.btag{border:2px solid #f08a24;color:#a8500a;animation:pop .35s cubic-bezier(.3,1.6,.5,1)}
.ltag,.mtag{border:2px solid #8e44d6;color:#6a2bb0;animation:pop .35s cubic-bezier(.3,1.6,.5,1)}
.mtag.eq{border-color:#2e9e4f;color:#1d6b35;background:#effbf1}
@keyframes pop{from{transform:translate(-50%,-50%) scale(.75);opacity:0}to{transform:translate(-50%,-50%) scale(1);opacity:1}}
.tag.off{display:none}
.alab,.vlab{transition:none}
.alab{animation:fade .3s ease-out}
.chip{font-family:'Baloo 2',system-ui,sans-serif;font-weight:700;font-size:27px;line-height:1.1;padding:9px 28px 7px;border-radius:14px;border:2px solid #cfe6f7;background:#fff;color:#123b63;box-shadow:0 4px 12px rgba(18,59,99,.14);animation:chipIn .34s cubic-bezier(.2,1.25,.5,1);white-space:pre}
.chip.long{font-size:23px;padding:8px 22px 6px}
.chip.gold{background:#fdf0c4;color:#6e4210;border-color:#efcb6e}
.chip.good{background:#e2f7e6;color:#1d6b35;border-color:#8fd3a1}
.chip.bad{background:#fde6e2;color:#9b2c1f;border-color:#f2a99d}
@keyframes chipIn{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}
.edge{transition:stroke .35s ease}
.arc{stroke-dasharray:100 100;animation:arcIn .5s ease-out backwards}
.d1{animation-delay:.15s}
.d2{animation-delay:.3s}
.d3{animation-delay:.45s}
.alab.d0,.alab.d1,.alab.d2,.alab.d3{animation:fade .3s ease-out backwards}
.alab.d1{animation-delay:.25s}
.alab.d2{animation-delay:.4s}
.alab.d3{animation-delay:.55s}
@keyframes arcIn{from{stroke-dashoffset:100}to{stroke-dashoffset:0}}
.fadein{animation:fade .35s ease-out}
@keyframes fade{from{opacity:0}to{opacity:1}}
.fadeA{animation:fadeA .3s ease-out}
.fadeB{animation:fadeB .3s ease-out}
@keyframes fadeA{from{opacity:0}to{opacity:1}}
@keyframes fadeB{from{opacity:0}to{opacity:1}}
.next{height:54px;padding:0 26px 0 30px;border-radius:999px;border:0;background:#d9640a;color:#fff;font-family:'Baloo 2',system-ui,sans-serif;font-weight:800;font-size:24px;display:flex;align-items:center;gap:8px;box-shadow:0 5px 0 #a54a05;cursor:pointer}
.next:disabled{background:#9fb3c4;box-shadow:0 5px 0 #7d92a4;cursor:not-allowed}
.next.ready{animation:ready 1.8s ease-in-out infinite}
@keyframes ready{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
.ibtn{width:48px;height:48px;border-radius:50%;border:2px solid #cfe6f7;background:#fff;color:#123b63;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;box-shadow:0 3px 0 #a9cfe8}
.ibtn:disabled{opacity:.45;cursor:not-allowed}
.opt{border:3px solid #bfe0f5;background:#fff;color:#123b63;border-radius:16px;font-weight:800;font-size:20px;cursor:pointer;box-shadow:0 4px 0 #9ccbe8;transition:transform .12s ease}
.opt:hover{transform:translateY(-2px)}
.opt.good{background:#e3f7e7;border-color:#2e9e4f;box-shadow:0 4px 0 #23803f}
.opt.bad{background:#fde6e3;border-color:#d94a35;box-shadow:0 4px 0 #ad3523;animation:shake .4s ease}
.opt:disabled{cursor:default}
.opt:disabled:hover{transform:none}
@keyframes bumpA{0%,100%{transform:scale(1)}40%{transform:scale(1.12)}}
@keyframes bumpB{0%,100%{transform:scale(1)}40%{transform:scale(1.12)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}50%{transform:translateX(5px)}75%{transform:translateX(-3px)}}
.lab{position:absolute;width:160px;height:50px;border-radius:12px;border:2px solid #efcb6e;background:#fdf0c4;color:#6e4210;font-weight:900;font-size:15px;display:flex;align-items:center;justify-content:center;cursor:grab;box-shadow:0 4px 0 #d9b04c;touch-action:none;padding:0 6px}
.lab.sel{border-color:#d9640a;box-shadow:0 0 0 4px rgba(217,100,10,.3),0 4px 0 #d9b04c}
.lab.drag{cursor:grabbing;box-shadow:0 12px 22px rgba(18,59,99,.28);transform:scale(1.05);z-index:5}
.lab.lock{background:#e3f7e7;border-color:#2e9e4f;color:#1d6b35;box-shadow:0 4px 0 #23803f;cursor:default}
.slot{position:absolute;width:284px;height:64px;border-radius:14px;border:3px dashed #8cc3e6;background:rgba(255,255,255,.55);cursor:pointer;color:#5b7f9c;font-weight:800;font-size:15px}
.slot.hot{border-color:#d9640a;background:rgba(255,243,228,.85)}
.star{color:#c9d6e0}
.star.on{color:#f2b51c}
.startbtn{height:68px;padding:0 40px;border-radius:999px;border:0;background:#d9640a;color:#fff;font-family:'Baloo 2',system-ui,sans-serif;font-weight:800;font-size:30px;display:flex;align-items:center;gap:12px;box-shadow:0 6px 0 #a54a05;cursor:pointer;animation:ready 1.8s ease-in-out infinite}
.leg-glow{stroke-opacity:.9;animation:legGlow 1.8s ease-in-out infinite}
@keyframes legGlow{0%,100%{stroke-opacity:.78;stroke-width:20px}50%{stroke-opacity:1;stroke-width:25px}}
</style>

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1920,"height":1080}}'>
// =====================================================================
// CONFIG — tuning values for the board, snapping, pacing and limits.
// =====================================================================
const CONFIG = {
  pxPerCm: 40,                       // board scale: 1 cm = 40 board px
  start: { D: 45, C: 475, baseY: 340, height: 170, legAD: 5, legBC: 7 }, // opening scalene shape (cm for legs)
  limits: { minTop: 90, minBottom: 160, maxLegRun: 243, minX: 16, maxX: 478 }, // keeps the shape readable (angles ~35°–145°)
  snap: { equalLegsCm: 0.3, rightAngleDeg: 3 },
  ruler: { home: { x: 110, y: 382, a: -3 }, flyMs: 600, holdMs: 700, returnMs: 450 },
  timing: { idleMs: 9000, idleMaxHints: 3, navLockMs: 450, autoNextMs: 1200 },
  stars: [[5, 3], [3, 2], [0, 1]]    // [first-try correct >=, stars]
};

// =====================================================================
// LESSON — every learning state and check, in play order.
//   lines: narration (t = on-screen text, s = optional spoken text, chips = labels shown with the line)
//   task:  what the learner must do before Next unlocks (extLegs, extBases, tapBases, tapLegs, measure,
//          dragB, tapAngles, dragD90, tapAD, dragD, dragC); hint = on-screen instruction; idle = idle nudge
//   after: lines played once the task is done; autoNext: advance by itself after `after`
//   f:     board display flags (legHint, baseExt, par, legsPurple, legLen, ticks, arcs, right, eq)
//   cfu:   check number; opts (ok / fb feedback), ok = praise line
// =====================================================================
const LESSON = {
  steps: [
    { id: 'intro', lines: [{ t: "Let's take a look at this quadrilateral and see what makes it special." }] },
    { id: 'meet', lines: [{ t: 'These two sides look like they will meet.' }], f: { legGlow: 1 } },
    { id: 'extend', lines: [{ t: "Let's extend them." }], task: 'extLegs', hint: 'Tap each slanted side to extend it',
      after: [{ t: 'Woah! The sides meet.' }] },
    { id: 'other', lines: [{ t: "Let's check the other\npair of sides." }], task: 'extBases', hint: 'Tap the top and bottom sides to extend them' },
    { id: 'parallel', lines: [{ t: 'They do not meet.' }], f: { baseExt: 1 } },
    { id: 'abcd', lines: [{ t: 'This means the sides are parallel to each other.', chips: [{ t: 'AB ∥ CD', k: 'white' }] }], f: { par: 1 } },
    { id: 'onePair', lines: [{ t: "So this quadrilateral has\none pair of parallel sides.", chips: [{ t: 'AB ∥ CD', k: 'white' }] }], f: { par: 1 } },
    { id: 'def', lines: [{ t: 'We call this a trapezium.', chips: [{ t: 'Trapezium', k: 'gold' }] }], f: { par: 1 } },
    { id: 'defFull', lines: [{ t: 'A quadrilateral with at least\none pair of parallel sides\nis called a trapezium.', chips: [{ t: 'Trapezium', k: 'gold' }] }], f: { par: 1 } },
    { id: 'bases', lines: [{ t: 'The parallel sides\nare called bases.' }], f: { par: 1 } },
    { id: 'legs', lines: [{ t: 'And the non-parallel sides\nare called legs.' }], f: { par: 1 } },
    { id: 'measure', lines: [{ t: "Let's measure the sides\nof this trapezium." }], task: 'measure', hint: 'Drag the ruler onto a leg, or tap a leg', idle: 'Drag the yellow ruler onto a slanted side, or just tap a leg.', f: { par: 1, legsPurple: 1 } },
    { id: 'scalene', lines: [{ t: 'Woah! All the sides of\nthis trapezium are of\ndifferent lengths.' }, { t: 'This type of trapezium which\nhas sides of different lengths\nis called a scalene trapezium.', chips: [{ t: 'Scalene trapezium', k: 'gold' }] }],
      f: { par: 1, legsPurple: 1, legLen: 1 } },
    { id: 'equal', lines: [{ t: "Let's change its\nshape a little." }], task: 'dragB', hint: 'Drag point B along the top side', after: [{ t: 'Perfect! Both legs are equal.' }], autoNext: 1,
      f: { par: 1, legsPurple: 1, legLen: 1 } },
    { id: 'iso', lines: [{ t: 'Yay! Now the legs are of same lengths.' }, { t: 'This is an isosceles trapezium.', chips: [{ t: 'Isosceles trapezium', k: 'gold' }] }],
      f: { par: 1, legsPurple: 1, legLen: 1, ticks: 1 } },
    { id: 'angles', lines: [{ t: "Now, let's measure its angles." }], task: 'tapAngles', hint: 'Tap each corner to measure its angle', f: { par: 1, ticks: 1 } },
    { id: 'make90', lines: [{ t: 'Can you make ∠A exactly 90°?' }], task: 'dragD90', hint: 'Drag point D along the bottom side', after: [{ t: 'Perfect! ∠A is exactly 90°.' }], autoNext: 1, f: { par: 1, arcs: 'A' } },
    { id: 'right', lines: [{ t: 'Look! We made another right angle too!' }, { t: 'This is a right trapezium.', chips: [{ t: 'Right trapezium', k: 'gold' }] }],
      f: { par: 1, right: 1 } },
    { id: 'add', lines: [{ t: 'What happens if we add these two angles?' }], task: 'tapAD', hint: 'Tap ∠A and ∠D to add them',
      after: [{ t: 'They add up to 180°!' }], f: { par: 1, right: 1, arcs: 'AD' } },
    { id: 'change', lines: [{ t: 'What if we change the shape?' }], task: 'dragD', hint: 'Drag point D and watch the angles',
      after: [{ t: 'The angles changed… but their sum is still 180°!' }], f: { par: 1, arcs: 'AD', eq: 'AD' } },
    { id: 'otherleg', lines: [{ t: 'Does the same thing happen on the other leg?' }], task: 'dragC', hint: 'Drag point C and watch the angles',
      after: [{ t: 'This pair also adds up to 180°!' }], f: { par: 1, arcs: 'BC', eq: 'BC' } },
    { id: 'rule', lines: [{ t: 'Angles on the same leg of a trapezium add up to 180°.', chips: [{ t: '∠A + ∠D = 180°    ∠B + ∠C = 180°', k: 'gold' }] }],

  // ---------- render ----------

    const hit = (k, p, q) => seg(p, q, edgeTask, { cls: edgeTask && pulseEdge(k) ? 'hitp' : '', click: edgeTask ? () => this.tapEdge(k) : noop });
    g.tAB = hit('AB', A, B); g.tBC = hit('BC', B, C); g.tCD = hit('CD', C, D); g.tDA = hit('DA', D, A);
    // labels: a fixed set of slots (hidden ones get "off") so each tag keeps its element and
    // only animates when it first appears
    const cx = (A.x + B.x + C.x + D.x) / 4, cy = (A.y + B.y + C.y + D.y) / 4;
    const tags = [];
    ['A', 'B', 'C', 'D'].forEach((k) => {
      const Vk = P[k]; let dx = Vk.x - cx, dy = Vk.y - cy; const L = Math.hypot(dx, dy) || 1;
      tags.push({ t: k, x: r1(Vk.x + dx / L * 25), y: r1(Vk.y + dy / L * 25), cls: 'vlab' });
    });
    ['A', 'B', 'C', 'D'].forEach((k) => tags.push(aTag[k]));
    // a tag beside a side, pushed out along the side's outward normal far enough that its box clears the line
    const side = (p, q, text, cls, show) => {
      const mx = (p.x + q.x) / 2, my = (p.y + q.y) / 2, L = this.dist(p, q) || 1;
      let nx = -(q.y - p.y) / L, ny = (q.x - p.x) / L;
      if (nx * (mx - cx) + ny * (my - cy) < 0) { nx = -nx; ny = -ny; }
      const hw = (text.length * 9.6 + 32) / 2, hh = 16;
      const off = hw * Math.abs(nx) + hh * Math.abs(ny) + 12;
      // outside the shape first; if the board edge would push it back onto the side, tuck it inside instead
      const need = hw * Math.abs(nx) + hh * Math.abs(ny) + 4;
      const place = (sg) => {
        const x = Math.max(hw - 8, Math.min(516 - hw, mx + sg * nx * off)), y = Math.max(18, Math.min(404, my + sg * ny * off));
        return { x: x, y: y, ok: Math.abs(nx * (x - mx) + ny * (y - my)) >= need };
      };
      let pos = place(1);
      if (!pos.ok) pos = place(-1);
      const x = pos.x, y = pos.y;
      return { t: text, x: r1(x), y: r1(y), cls: cls + (show ? '' : ' off') };
    };
    const isB = st.id === 'bases', isL = st.id === 'legs', isM = st.id === 'measure';
    tags.push(side(A, B, 'Base', 'btag', isB && !!s.tap.AB));
    tags.push(side(D, C, 'Base', 'btag', isB && !!s.tap.CD));
    tags.push(side(D, A, 'Leg', 'ltag', isL && !!s.tap.DA));
    tags.push(side(B, C, 'Leg', 'ltag', isL && !!s.tap.BC));
    tags.push(side(D, A, 'AD = ' + this.cm(ad), 'mtag', isM && !!s.tap.DA));
    tags.push(side(B, C, 'BC = ' + this.cm(bc), 'mtag', isM && !!s.tap.BC));
    const near = Math.abs(ad - bc) < CONFIG.snap.equalLegsCm * this.S;
    const eqCls = 'mtag' + ((task === 'dragB' && near) || st.id === 'iso' ? ' eq' : '');
    tags.push(side(D, A, this.cm(ad), eqCls, !!f.legLen));
    tags.push(side(B, C, this.cm(bc), eqCls, !!f.legLen));
    return { g: g, tags: tags, V: V };
  }

  renderVals() {
    const s = this.state, steps = this.steps(), st = this.cur();
    const isLesson = !st.cfu && !st.end;
    const words = this.toWords(s.line || '').map((w, i) => ({
      t: w, cls: i < s.reveal - 1 ? 'on' : (i === s.reveal - 1 ? (s.talking ? 'cur' : 'on') : '')
    }));
    const G = isLesson ? this.geo() : { g: {}, tags: [], V: {} };
    // chips
    let chips = s.chips.slice();
    const f = st.f || {};
    if (isLesson && f.eq === 'AD') chips = [{ t: G.V.A + '° + ' + G.V.D + '° = 180°', k: 'white' }];
    if (isLesson && f.eq === 'BC') chips = [{ t: G.V.B + '° + ' + G.V.C + '° = 180°', k: 'white' }];
    if (st.id === 'add' && s.done) chips = [{ t: G.V.A + '° + ' + G.V.D + '° = 180°', k: 'gold' }];
    // cfu options
    const mk = (o) => ({ id: o.id, t: o.t || o.id, cls: s.picks[o.id] || '', dis: !!s.picks[o.id] || s.done, pick: () => this.pick(o) });
    const c1 = {};
    if (st.cfu === 1) st.opts.forEach((o) => { c1[o.id] = mk(o); });
    const hasOpts = !!(st.cfu && st.cfu !== 1 && st.opts);
    const opts = hasOpts ? st.opts.map(mk) : [];
    // cfu4
    const c4 = s.c4;
    const labs = this.labsDef().map((l) => {
      const p = this.labPos(l.id);
      const cls = c4.locked[l.id] ? 'lock' : (c4.drag && c4.drag.id === l.id ? 'drag' : (c4.sel === l.id ? 'sel' : ''));
      return { id: l.id, t: l.t, x: Math.round(p.x), y: Math.round(p.y), cls: cls, down: (e) => this.labDown(l.id, e) };
    });
    const slots = this.slotsDef().map((q, i) => {
      const filled = Object.keys(c4.at).some((k) => c4.at[k] === q.id);
      return { id: q.id, y: q.y, cls: c4.sel && !filled ? 'hot' : '', t: filled ? '' : 'Drop label here', aria: 'Label slot for shape ' + (i + 1), tap: () => this.slotTap(q.id) };
    });
    // end
    const nRight = Object.keys(s.results).filter((k) => s.results[k]).length;
    const nStars = CONFIG.stars.find((r) => nRight >= r[0])[1];
    const lessonCount = steps.findIndex((x) => x.cfu === 1);
    let progressLabel;
    if (st.end) progressLabel = 'Done';
    else if (st.cfu) progressLabel = 'Check ' + st.cfu + ' / 5';
    else progressLabel = 'Step ' + (s.step + 1) + ' / ' + lessonCount;
    const isLastCfu = st.cfu === 5;
    return {
      rootMove: (e) => this.rootMove(e),
      rootUp: (e) => this.rootUp(e),
      start: () => this.start(),
      restart: () => this.restart(),
      replay: () => this.replay(),
      toggleMute: () => this.toggleMute(),
      next: () => this.next(),
      back: () => this.back(),
      muted: !!s.muted, unmuted: !s.muted, muteLabel: s.muted ? 'Turn sound on' : 'Turn sound off',
      notStarted: !s.started,
      isLesson: isLesson && s.started,
      isCfu1: st.cfu === 1, isCfu2: st.cfu === 2, isCfu3: st.cfu === 3, isCfu4: st.cfu === 4, isCfu5: st.cfu === 5,
      isEnd: !!st.end,
      g: G.g, tags: G.tags,
      words: words,
      bubCls: s.bub,
      // lesson steps share one board, so it only fades in when it first appears; each check fades in fresh
      fadeCls: st.cfu || st.end ? (s.step % 2 ? 'fadeA' : 'fadeB') : 'fadeA',
      birdCls: 'bird', // Swiftee stays static; feedback comes from chips, hints and narration
      chips: chips.map((c) => ({ t: c.t, k: c.k + (c.t.length > 20 ? ' long' : '') })),
      rootDown: () => this.rootDown(),
      wordSize: words.length > 15 ? 22 : 24,
      c1: c1, hasOpts: hasOpts, opts: opts, optTop: st.optTop || 376,
      labs: labs, slots: slots,
      stars: [0, 1, 2].map((i) => ({ cls: i < nStars ? 'on' : '' })),
      scoreText: 'You got ' + nRight + ' of 5 checks right on the first try.',
      progressW: Math.round((s.step / (steps.length - 1)) * 100) + '%',
      progressLabel: progressLabel,
      showNav: s.started && !st.end,
      backDisabled: s.step === 0,
      nextDisabled: !s.done,
      nextCls: s.done && !s.talking ? 'ready' : '',
      nextLabel: isLastCfu ? 'Finish' : 'Next'
    };
  }
}
</script>
