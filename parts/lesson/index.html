</button>
<button data-qa="opt-C" class="opt gridopt {{c1.C.cls}}" disabled="{{c1.C.dis}}" onClick="{{c1.C.pick}}" aria-label="Shape C" style="position: relative; height: 206px; display: flex; align-items: center; justify-content: center">
<svg width="262" height="157" viewBox="0 0 200 120" aria-hidden="true"><polygon points="24,98 150,98 176,22 50,22" fill="#d3f4d8" stroke="#1f9a49" stroke-width="4" stroke-linejoin="round"></polygon><path d="M106.2,28 L112.2,22 L106.2,16 M113.8,28 L119.8,22 L113.8,16 M80.2,104 L86.2,98 L80.2,92 M87.8,104 L93.8,98 L87.8,92 M41.7,64.8 L38,57.2 L30.4,60.9 M167.7,64.8 L164,57.2 L156.4,60.9" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"></path><path d="M106.2,28 L112.2,22 L106.2,16 M113.8,28 L119.8,22 L113.8,16 M80.2,104 L86.2,98 L80.2,92 M87.8,104 L93.8,98 L87.8,92 M41.7,64.8 L38,57.2 L30.4,60.9 M167.7,64.8 L164,57.2 L156.4,60.9" fill="none" stroke="#ff7a00" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></path></svg>
</button>
<button data-qa="opt-D" class="opt gridopt {{c1.D.cls}}" disabled="{{c1.D.dis}}" onClick="{{c1.D.pick}}" aria-label="Shape D" style="position: relative; height: 206px; display: flex; align-items: center; justify-content: center">
<svg width="262" height="157" viewBox="0 0 200 120" aria-hidden="true"><polygon points="32,65 116,21 160,35 170,75 66,99" fill="#ffe5bd" stroke="#d27a14" stroke-width="4" stroke-linejoin="round"></polygon></svg>
</button>
</div>
</sc-if>

<sc-if value="{{fillOn}}" hint-placeholder-val="{{ false }}">
<div class="{{fillCls}}" style="position: absolute; left: 120px; top: {{optTop}}px; width: 1040px">
<div class="blank-row">
<sc-for list="{{blanks}}" as="bk" hint-placeholder-count="2">
<span class="blank-grp {{bk.gap}}"><span class="blank-pre">{{bk.pre}}</span><button class="{{bk.cls}}" data-blank="{{bk.id}}" data-qa="blank-{{bk.id}}" onClick="{{bk.tap}}" aria-label="Answer box {{bk.pre}}"><span class="dd-val {{bk.ph}}">{{bk.t}}</span></button><span class="blank-post">{{bk.post}}</span><span class="blank-eq">{{bk.eq}}</span></span>
</sc-for>
</div>
<div class="tile-row">
<sc-for list="{{tiles}}" as="tl" hint-placeholder-count="3">
<button class="{{tl.cls}}" data-qa="tile-{{tl.i}}" onPointerDown="{{tl.down}}" aria-label="{{tl.t}}">{{tl.t}}</button>
</sc-for>
</div>
</div>
</sc-if>
<sc-if value="{{menuOn}}" hint-placeholder-val="{{ false }}">
<div class="{{menu.cls}}" role="listbox" style="left: {{menu.x}}px; top: {{menu.y}}px; width: {{menu.w}}px">
<sc-for list="{{menuItems}}" as="mi" hint-placeholder-count="3">
<button class="dd-item" role="option" data-qa="ddopt-{{mi.t}}" onClick="{{mi.pick}}">{{mi.t}}</button>
</sc-for>
</div>
</sc-if>
<sc-if value="{{ghostOn}}" hint-placeholder-val="{{ false }}">
<div class="tile ghost" style="left: {{ghost.x}}px; top: {{ghost.y}}px">{{ghost.t}}</div>
</sc-if>

<sc-if value="{{hasOpts}}" hint-placeholder-val="{{ false }}">
<div class="{{optCls}}" style="position: absolute; left: {{optLeft}}px; top: {{optTop}}px; width: {{optW}}px; display: flex; gap: 12px">
<sc-for list="{{opts}}" as="o" hint-placeholder-count="3">
<button class="opt {{o.cls}}" data-qa="opt-{{o.id}}" disabled="{{o.dis}}" onClick="{{o.pick}}" style="flex-grow: 1; flex-basis: 0; height: 87px; padding: 4px 8px; line-height: 1.15">{{o.t}}</button>
</sc-for>
</div>
</sc-if>

<sc-if value="{{isEnd}}" hint-placeholder-val="{{ false }}">
<!-- the score card (the lesson's own page only): centred in the card's room right of Swiftee and her bubble -->
<div class="{{fadeCls}}" style="position: absolute; left: 600px; top: 150px; width: 460px; height: 360px; border-radius: 28px; background: rgba(255,255,255,0.9); border: 3px solid #cfe6f7; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; box-shadow: 0 10px 30px rgba(18,59,99,0.15)">
<div style="font-family: 'Baloo 2', 'Noto Sans Math', system-ui, sans-serif; font-weight: 800; font-size: 42px; line-height: 1.05; color: #123b63; text-align: center">Lesson complete!</div>
<div style="display: flex; gap: 10px">
<sc-for list="{{stars}}" as="st" hint-placeholder-count="3">
<svg class="star {{st.cls}}" width="62" height="62" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5l2.9 5.9 6.5.9-4.7 4.6 1.1 6.4L12 17.3l-5.8 3 1.1-6.4-4.7-4.6 6.5-.9z" fill="currentColor" stroke="#c48f05" stroke-width="0.8" stroke-linejoin="round"></path></svg>
</sc-for>
</div>
<div style="font-weight: 800; font-size: 20px; color: #123b63; text-align: center; max-width: 360px">{{scoreText}}</div>
<button class="next" onClick="{{restart}}" style="margin-top: 6px">Play again</button>
</div>
</sc-if>

<div class="chip-row{{chipRowCls}}" style="position: absolute; left: calc({{chipLeft}}px - 80px); top: {{chipTop}}px; width: 1040px; height: 104px; display: flex; flex-direction: row; flex-wrap: wrap; align-items: center; align-content: center; justify-content: center; gap: 12px; pointer-events: none">
<sc-for list="{{chips}}" as="cp" hint-placeholder-count="1">
<div class="chip {{cp.k}}" aria-label="{{cp.t}}"><span class="chip-cap">{{cp.cap}}</span><span class="chip-ln"><span>{{cp.p0}}</span><span class="op">{{cp.s0}}</span><span>{{cp.p1}}</span><span class="op">{{cp.s1}}</span><span>{{cp.p2}}</span><span class="op">{{cp.s2}}</span><span>{{cp.p3}}</span><span class="op">{{cp.s3}}</span><span>{{cp.p4}}</span></span></div>
</sc-for>
</div>

<div class="{{swCls}}" style="position: absolute; top: 401px; width: 259px; height: 259px; pointer-events: none">
<img class="bird swiftee-still" src="assets/images/swiftee.webp" alt="Swiftee the bird" style="position: absolute; left: 42px; top: 29px; width: 180px; height: 198px">
<canvas class="swiftee-sprite" width="256" height="256" aria-hidden="true" style="position: absolute; left: 0px; top: 0px; width: 259px; height: 259px"></canvas>
</div>
<div class="sum-root"></div>
<div class="bubble {{bubCls}} {{bubHide}}" style="position: absolute; left: 240px; bottom: 322px; pointer-events: none; --pw: {{plateW}}px">
<div aria-live="polite" class="bubble-text" style="font-size: {{wordSize}}px" data-qa="bubble">
<sc-for list="{{words}}" as="wd" hint-placeholder-count="6">
<span class="w {{wd.cls}}">{{wd.t}}</span>
</sc-for>
</div>
<svg class="bubble-tail" width="34" height="22" viewBox="0 0 34 22" aria-hidden="true"><path class="tail-fill" d="M-0.5,-2 L-0.5,1.5 L17,19 L34.5,1.5 L34.5,-2 Z"></path><path class="tail-edge" d="M-0.5,1.5 L17,19 L34.5,1.5"></path></svg>

</div>

<!-- (no screen list, Back or Next: each screen moves on by itself once its voice and animations are done, and a
     screen that asks for something waits for it; ?dev=1 on the journey's page jumps to any screen) -->

<canvas class="angle-walk" width="1280" height="720" aria-hidden="true" style="position: absolute; left: 0px; top: 0px; width: 1280px; height: 720px; pointer-events: none; z-index: 12"></canvas>
<div class="walker" aria-hidden="true" style="position: absolute; left: 0px; top: 0px; width: 120px; height: 120px; pointer-events: none; visibility: hidden; z-index: 12"><canvas width="512" height="512" style="width: 100%; height: 100%; display: block"></canvas></div>

<sc-if value="{{handOn}}" hint-placeholder-val="{{ false }}">
<div class="{{hand.cls}}" style="left: {{hand.x}}px; top: {{hand.y}}px; --dx: {{hand.dx}}px; --dy: {{hand.dy}}px" aria-hidden="true">
<span class="hand-ring"></span>
<span class="hand-move"><img src="assets/images/hand-nudge.webp" alt=""></span>
</div>
</sc-if>
<!-- the journey's Next buttons, at the bottom middle of the card (as Fishing Frenzy's): the end's, under Swiftee's goodbye, and the
     summary's, once every idea has been explained - the learner moves on when they choose -->
<sc-if value="{{endNext}}" hint-placeholder-val="{{ false }}"><button class="next end-next" data-qa="end-next" onClick="{{endGo}}">Next <span aria-hidden="true">▶</span></button></sc-if>
<sc-if value="{{showSumNext}}" hint-placeholder-val="{{ false }}"><button class="next end-next sum-next" data-qa="sum-next" onClick="{{sumNextGo}}">Next <span aria-hidden="true">▶</span></button></sc-if>

</div>
<sc-if value="{{notStarted}}" hint-placeholder-val="{{ false }}">
<button class="journey-next" data-qa="start" onClick="{{begin}}">Next <span aria-hidden="true">▶</span></button>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1920,"height":1080}}'>
var Component = window.TrapeziumGame;
</script>
<script src="js/stage-fit.js"></script>
<script>window.PopoGame = { STAGE_W: 1672, STAGE_H: 941, SEABED_Y: 805 }; /* the fishing games' world, for js/water-gl.js */</script>
<script src="js/water-gl.js"></script>
<script src="js/water.js"></script>
<script src="js/opening.js"></script>
<script src="js/card-life.js"></script>
<script src="js/confetti.js"></script>
</body>
</html>
